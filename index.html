<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celsius Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

</head>
<body>

<div class="converterBox">
    <h2 style="text-align: center;">ദ്ദി◝ ⩊ ◜.ᐟ</h2>
    <h2>Conversor de Temperatura</h2>
    <h3>°C -> °F y K</h3>
    
<label>Celsius:</label>
<input type="number" id="celsius" oninput="convertTemperature('celsius')">

<label>Fahrenheit:</label>
<input type="number" id="fahrenheit" oninput="convertTemperature('fahrenheit')">

<label>Kelvin:</label>
<input type="number" id="kelvin" oninput="convertTemperature('kelvin')">
</div>

<script src="script.js"></script>
</body>
</html>

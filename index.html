<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celsius Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

</head>
<body>

<div class="converterBox">
    <h2 style="text-align: center;">ദ്ദി◝ ⩊ ◜.ᐟ</h2>
    <h2>Conversor de Temperatura</h2>
    
    <label for="celsius">Celsius (°C):</label>
    <input type="number" id="celsius" placeholder="Ingrese Celsius..." oninput="convertTemperature()">
    
    <label for="fahrenheit">Fahrenheit (°F):</label>
    <input type="text" id="fahrenheit" readonly placeholder="Resultado...">
    
    <label for="kelvin">Kelvin (K):</label>
    <input type="text" id="kelvin" readonly placeholder="Resultado...">
</div>

<script src="script.js"></script>
</body>
</html>
